name: Publish Doxygen Documentation

on:
  push:
    branches:
      - main
    paths:
      - "Plugins/UtilityAI/Source/**"
      - "Plugins/UtilityAI/Documentation/**"
      - ".github/workflows/doxygen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen documentation
        working-directory: Plugins/UtilityAI/Documentation
        run: doxygen Doxyfile

      - name: Upload Doxygen HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: Plugins/UtilityAI/Documentation/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4